<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Dashboard - Analytics & Insights</title>
    <meta name="description" content="Comprehensive sales dashboard with real-time analytics, charts, and filtering capabilities">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-content">
                <h1><i class="fas fa-chart-line"></i> Sales Dashboard</h1>
                <div class="header-actions">
                    <button class="btn btn-primary" id="refreshData">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                    <div class="date-range">
                        <i class="fas fa-calendar"></i>
                        <span id="dateRange">Last 30 Days</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Filters Section -->
        <section class="filters-section">
            <div class="filters-container">
                <div class="filter-group">
                    <label for="categoryFilter">Category</label>
                    <select id="categoryFilter" class="filter-select">
                        <option value="all">All Categories</option>
                        <option value="electronics">Electronics</option>
                        <option value="clothing">Clothing</option>
                        <option value="home">Home & Garden</option>
                        <option value="sports">Sports & Outdoors</option>
                        <option value="books">Books & Media</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="regionFilter">Region</label>
                    <select id="regionFilter" class="filter-select">
                        <option value="all">All Regions</option>
                        <option value="north">North</option>
                        <option value="south">South</option>
                        <option value="east">East</option>
                        <option value="west">West</option>
                        <option value="central">Central</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="timeFilter">Time Period</label>
                    <select id="timeFilter" class="filter-select">
                        <option value="7">Last 7 Days</option>
                        <option value="30" selected>Last 30 Days</option>
                        <option value="90">Last 90 Days</option>
                        <option value="365">Last Year</option>
                    </select>
                </div>
                <button class="btn btn-secondary" id="clearFilters">
                    <i class="fas fa-times"></i> Clear All
                </button>
            </div>
        </section>

        <!-- KPI Cards -->
        <section class="kpi-section">
            <div class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-icon">
                        <i class="fas fa-dollar-sign"></i>
                    </div>
                    <div class="kpi-content">
                        <h3>Total Revenue</h3>
                        <p class="kpi-value" id="totalRevenue">$0</p>
                        <span class="kpi-change positive" id="revenueChange">+0%</span>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon">
                        <i class="fas fa-shopping-cart"></i>
                    </div>
                    <div class="kpi-content">
                        <h3>Total Orders</h3>
                        <p class="kpi-value" id="totalOrders">0</p>
                        <span class="kpi-change positive" id="ordersChange">+0%</span>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="kpi-content">
                        <h3>Active Customers</h3>
                        <p class="kpi-value" id="activeCustomers">0</p>
                        <span class="kpi-change positive" id="customersChange">+0%</span>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon">
                        <i class="fas fa-chart-line"></i>
                    </div>
                    <div class="kpi-content">
                        <h3>Conversion Rate</h3>
                        <p class="kpi-value" id="conversionRate">0%</p>
                        <span class="kpi-change positive" id="conversionChange">+0%</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Charts Section -->
        <section class="charts-section">
            <div class="charts-grid">
                <!-- Line Chart -->
                <div class="chart-container">
                    <div class="chart-header">
                        <h3>Monthly Sales Trend</h3>
                        <div class="chart-controls">
                            <button class="chart-btn active" data-metric="revenue">Revenue</button>
                            <button class="chart-btn" data-metric="orders">Orders</button>
                            <button class="chart-btn" data-metric="customers">Customers</button>
                        </div>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="salesTrendChart"></canvas>
                    </div>
                </div>

                <!-- Pie Chart -->
                <div class="chart-container">
                    <div class="chart-header">
                        <h3>Sales by Category</h3>
                        <div class="chart-controls">
                            <button class="chart-btn active" data-pie="category">Category</button>
                            <button class="chart-btn" data-pie="region">Region</button>
                            <button class="chart-btn" data-pie="age">Age Group</button>
                        </div>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="demographicsChart"></canvas>
                    </div>
                </div>
            </div>
        </section>

        <!-- Data Table -->
        <section class="table-section">
            <div class="table-container">
                <div class="table-header">
                    <h3>Recent Sales</h3>
                    <div class="table-actions">
                        <button class="btn btn-outline" id="exportData">
                            <i class="fas fa-download"></i> Export
                        </button>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table id="salesTable">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Date</th>
                                <th>Customer</th>
                                <th>Category</th>
                                <th>Region</th>
                                <th>Amount</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="salesTableBody">
                            <!-- Data will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading dashboard...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
